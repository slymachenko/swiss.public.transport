name: Build and Publish Tarball

# This workflow triggers whenever you push a tag that starts with 'v' (e.g., v1.0.0)
on:
  push:
    tags:
      - 'v*' 

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload assets to GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Build package tarball
        run: |
          R CMD build .
          # Find the generated .tar.gz file and save its name to the environment
          echo "TARBALL=$(ls *.tar.gz)" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload Tarball
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TARBALL }}
          generate_release_notes: true